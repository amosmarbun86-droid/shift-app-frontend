<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShiftBoard Face Verification</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0B1220;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status {
            width: 90%;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: #D8DEE9;
        }

        #faceContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }

        #faceGuide {
            width: 250px;
            height: 330px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 48% 48% 45% 45% / 42% 42% 55% 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
        }

        #faceGuideInner {
            width: 92%;
            height: 94%;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            border-radius: 48% 48% 45% 45% / 42% 42% 55% 55%;
            box-sizing: border-box;
        }

        #faceInstruction {
            margin-top: 24px;
            text-align: center;
            font-size: 16px;
            color: #D8DEE9;
        }

        #status {
            margin-top: 12px;
            width: 90%;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            color: #D8DEE9;
        }

    </style>
</head>

<body>

<div id="faceContainer">

    <div id="faceGuide">
        <div id="faceGuideInner"></div>
    </div>

    <div id="faceInstruction">
        Sesuaikan wajah dengan panduan
    </div>

    <div id="status">
        ShiftBoard Face Verification
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>

const MODEL_URL =
    "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

let modelReady = false;


// =====================================================
// STATUS HTML
// =====================================================

function tampilStatus(teks) {

    const status =
        document.getElementById("status");

    if (status) {
        status.innerText = teks;
    }
}


// =====================================================
// LOAD MODEL FACE API
// =====================================================

async function siapkanModel() {

    if (modelReady) {
        return;
    }

    tampilStatus(
        "⏳ Menyiapkan sistem pengenalan wajah..."
    );

    await Promise.all([

        faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        ),

        faceapi.nets.faceLandmark68Net.loadFromUri(
            MODEL_URL
        ),

        faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        )

    ]);

    modelReady = true;

    tampilStatus(
        "✅ Sistem pengenalan wajah siap."
    );
}


// =====================================================
// CALLBACK KE ANDROID
// =====================================================

function kirimHasil(
    cocok,
    nama,
    jarak,
    pesan
) {

    try {

        if (
            typeof Android !== "undefined" &&
            Android.onHasilVerifikasi
        ) {

            Android.onHasilVerifikasi(
                cocok,
                nama || "",
                Number(jarak || 999),
                pesan || ""
            );

        }

    } catch (e) {

        console.log(
            "Callback Android error:",
            e
        );
    }
}


// =====================================================
// FUNGSI UTAMA
// DIPANGGIL ANDROID
//
// base64Foto
// daftarKaryawanJson
// =====================================================

window.mulaiVerifikasi = async function(
    base64Foto,
    daftarKaryawanJson
) {

    try {

        // =================================================
        // LOAD MODEL
        // =================================================

        await siapkanModel();


        // =================================================
        // VALIDASI FOTO
        // =================================================

        if (
            !base64Foto ||
            base64Foto.length < 100
        ) {

            tampilStatus(
                "❌ Foto tidak valid."
            );

            kirimHasil(
                false,
                "",
                999,
                "Foto tidak valid."
            );

            return;
        }


        // =================================================
        // VALIDASI DATA KARYAWAN
        // =================================================

        if (
            !daftarKaryawanJson ||
            daftarKaryawanJson.length < 2
        ) {

            tampilStatus(
                "❌ Data karyawan belum tersedia."
            );

            kirimHasil(
                false,
                "",
                999,
                "Data karyawan belum tersedia."
            );

            return;
        }


        // =================================================
        // PARSE DATA KARYAWAN
        // =================================================

        let daftarKaryawan;

        try {

            daftarKaryawan =
                JSON.parse(
                    daftarKaryawanJson
                );

        } catch (e) {

            tampilStatus(
                "❌ Data karyawan tidak valid."
            );

            kirimHasil(
                false,
                "",
                999,
                "Data karyawan tidak valid."
            );

            return;
        }


        if (
            !Array.isArray(
                daftarKaryawan
            ) ||
            daftarKaryawan.length === 0
        ) {

            tampilStatus(
                "❌ Belum ada data wajah karyawan."
            );

            kirimHasil(
                false,
                "",
                999,
                "Belum ada data wajah karyawan."
            );

            return;
        }


        // =================================================
        // LOAD FOTO
        // =================================================

        tampilStatus(
            "📷 Memuat foto..."
        );

        const img =
            new Image();

        img.src =
            base64Foto;

        await new Promise(
            (resolve, reject) => {

                img.onload =
                    resolve;

                img.onerror =
                    reject;
            }
        );


        // =================================================
        // DETEKSI WAJAH
        // =================================================

        tampilStatus(
            "🔍 Mendeteksi wajah..."
        );

        const hasil =
            await faceapi
                .detectSingleFace(
                    img,
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 416,
                        scoreThreshold: 0.5
                    })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        // =================================================
        // WAJAH TIDAK TERDETEKSI
        // =================================================

        if (!hasil) {

            tampilStatus(
                "❌ Wajah tidak terdeteksi."
            );

            kirimHasil(
                false,
                "",
                999,
                "Wajah tidak terdeteksi di foto."
            );

            return;
        }


        // =================================================
        // DESCRIPTOR FOTO
        // =================================================

        const descriptorFoto =
            Array.from(
                hasil.descriptor
            );


        // =================================================
        // CARI WAJAH TERDEKAT
        // =================================================

        let namaTerbaik = "";

        let jarakTerbaik = 999;

        let jumlahValid = 0;


        for (
            let i = 0;
            i < daftarKaryawan.length;
            i++
        ) {

            const karyawan =
                daftarKaryawan[i];


            // ---------------------------------------------
            // NAMA
            // ---------------------------------------------

            const nama =
                String(
                    karyawan.nama || ""
                ).trim();


            // ---------------------------------------------
            // DESCRIPTOR
            // ---------------------------------------------

            let descriptor =
                karyawan.faceDescriptor;


            if (
                !nama ||
                !descriptor
            ) {

                continue;
            }


            // ---------------------------------------------
            // DESCRIPTOR BISA BERUPA STRING JSON
            // ---------------------------------------------

            if (
                typeof descriptor === "string"
            ) {

                try {

                    descriptor =
                        JSON.parse(
                            descriptor
                        );

                } catch (e) {

                    continue;
                }
            }


            // ---------------------------------------------
            // VALIDASI 128 ANGKA
            // ---------------------------------------------

            if (
                !Array.isArray(descriptor) ||
                descriptor.length !== 128
            ) {

                continue;
            }


            // ---------------------------------------------
            // KONVERSI ANGKA
            // ---------------------------------------------

            const descriptorTarget =
                descriptor.map(
                    Number
                );


            // ---------------------------------------------
            // CEK NILAI VALID
            // ---------------------------------------------

            let valid =
                true;

            for (
                let j = 0;
                j < descriptorTarget.length;
                j++
            ) {

                if (
                    !Number.isFinite(
                        descriptorTarget[j]
                    )
                ) {

                    valid = false;

                    break;
                }
            }


            if (!valid) {
                continue;
            }


            jumlahValid++;


            // ---------------------------------------------
            // HITUNG JARAK
            // ---------------------------------------------

            const jarak =
                faceapi.euclideanDistance(
                    descriptorFoto,
                    descriptorTarget
                );


            // ---------------------------------------------
            // SIMPAN TERDEKAT
            // ---------------------------------------------

            if (
                jarak < jarakTerbaik
            ) {

                jarakTerbaik =
                    jarak;

                namaTerbaik =
                    nama;
            }
        }


        // =================================================
        // TIDAK ADA DESCRIPTOR VALID
        // =================================================

        if (
            jumlahValid === 0
        ) {

            tampilStatus(
                "❌ Belum ada descriptor wajah karyawan yang valid."
            );

            kirimHasil(
                false,
                "",
                999,
                "Data wajah karyawan belum tersedia."
            );

            return;
        }


        // =================================================
        // BATAS KECOCOKAN
        // =================================================

        const batas =
            0.55;


        // =================================================
        // WAJAH COCOK
        // =================================================

        if (
            jarakTerbaik < batas
        ) {

            const pesan =
                "Wajah cocok dengan " +
                namaTerbaik +
                " (jarak " +
                jarakTerbaik.toFixed(3) +
                ")";


            tampilStatus(
                "✅ " + pesan
            );


            kirimHasil(
                true,
                namaTerbaik,
                jarakTerbaik,
                pesan
            );


            return;
        }


        // =================================================
        // WAJAH TIDAK COCOK
        // =================================================

        const pesanTidakCocok =
            "Wajah tidak cocok dengan data karyawan. " +
            "Jarak terdekat: " +
            jarakTerbaik.toFixed(3);


        tampilStatus(
            "❌ " +
            pesanTidakCocok
        );


        kirimHasil(
            false,
            namaTerbaik,
            jarakTerbaik,
            pesanTidakCocok
        );

    } catch (e) {

        console.error(
            "Error:",
            e
        );

        tampilStatus(
            "❌ Error verifikasi wajah: " +
            e.message
        );

        kirimHasil(
            false,
            "",
            999,
            "Error verifikasi wajah: " +
            e.message
        );
    }
};


// =====================================================
// TEST STATUS
// =====================================================

window.addEventListener(
    "load",
    function() {

        tampilStatus(
            "ShiftBoard Face Verification\n" +
            "Siap digunakan."
        );

    }
);

</script>

</body>
</html>
