<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShiftBoard Face Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0B1220;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h2 {
            margin-top: 30px;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #1b2638;
        }
    </style>
</head>

<body>

<h2>ShiftBoard</h2>

<p>Face Verification</p>

<div id="status">
    Memuat sistem...
</div>


<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>

const MODEL_URL =
    "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


function status(teks) {

    document.getElementById("status").innerText = teks;

}


async function testModel() {

    try {

        status("⏳ Memuat model face recognition...");


        await Promise.all([

            faceapi.nets.tinyFaceDetector.loadFromUri(
                MODEL_URL
            ),

            faceapi.nets.faceLandmark68Net.loadFromUri(
                MODEL_URL
            ),

            faceapi.nets.faceRecognitionNet.loadFromUri(
                MODEL_URL
            )

        ]);


        status(
            "✅ Face verification siap digunakan."
        );


    } catch (e) {

        status(
            "❌ Gagal memuat model: " +
            e.message
        );

        console.error(e);

    }

}


testModel();

</script>

</body>
</html>
